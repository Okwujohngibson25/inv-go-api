definitions:
  dto.InvestmentDTO:
    properties:
      amount:
        type: number
    required:
    - amount
    type: object
  dto.LoginUserDTO:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.PlanDTO:
    properties:
      duration:
        type: integer
      max_amount:
        type: number
      min_amount:
        type: number
      name:
        type: string
      roi:
        type: number
    required:
    - duration
    - max_amount
    - min_amount
    - name
    - roi
    type: object
  dto.RegisterUserDTO:
    properties:
      country:
        type: string
      email:
        type: string
      fullname:
        maxLength: 50
        minLength: 2
        type: string
      gender:
        enum:
        - male
        - female
        - other
        type: string
      password:
        minLength: 6
        type: string
      phone_number:
        maxLength: 15
        minLength: 7
        type: string
      username:
        maxLength: 20
        minLength: 3
        type: string
    required:
    - country
    - email
    - fullname
    - gender
    - password
    - phone_number
    - username
    type: object
  dto.ResetPasswordDTO:
    properties:
      confirm_password:
        type: string
      password:
        type: string
      token:
        type: string
    required:
    - confirm_password
    - password
    - token
    type: object
  dto.ResetPasswordLinkDTO:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  dto.UpdatePasswordDTO:
    properties:
      confirm_password:
        type: string
      new_password:
        type: string
      old_password:
        type: string
    required:
    - confirm_password
    - new_password
    - old_password
    type: object
  dto.UpdateUserBalanceDTO:
    properties:
      invested_amount:
        type: number
      profit_balance:
        type: number
      referal_bonus:
        type: number
      wallet_balance:
        type: number
    required:
    - invested_amount
    - profit_balance
    - referal_bonus
    - wallet_balance
    type: object
  dto.WithdrawalDTO:
    properties:
      amount:
        type: number
      coin_type:
        type: string
      wallet_address:
        type: string
    required:
    - amount
    - coin_type
    - wallet_address
    type: object
  response.ApiResponse:
    properties:
      data: {}
      error: {}
      message:
        type: string
      success:
        type: boolean
    type: object
host: localhost:8080
