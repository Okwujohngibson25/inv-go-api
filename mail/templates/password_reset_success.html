<!DOCTYPE html>
<html>

<head>
    <title>Password Reset Successful</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 20px auto;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #333333;
        }

        p {
            font-size: 16px;
            color: #555555;
            line-height: 1.5;
        }

        .footer {
            margin-top: 20px;
            font-size: 14px;
            color: #888888;
        }

        .highlight {
            color: #007BFF;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Password Reset Successful ✅</h2>
        <p>Hello {{.Fullname}},</p>
        <p>Your password for your account has been successfully reset.</p>
        <p>If you did not perform this action, we strongly recommend that you contact our support team immediately.</p>
        <p>Thank you for using <span class="highlight">{{.CompanyName}}</span>!</p>
        <div class="footer">
            <p>Stay safe,<br>{{.CompanyName}} Team</p>
        </div>
    </div>
</body>

</html>
