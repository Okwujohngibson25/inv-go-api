<!DOCTYPE html>
<html>

<head>
    <title>Withdrawal Notification</title>
    <style>
        /* Add your email styles here */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        .container {

            margin: 0 auto;
            padding: 5px;
        }

        .logo {
            max-width: 150px;
            display: block;
            margin: 0 auto;
        }

        .message {
            padding: 5px;
            background-color: #ffffff;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="message">
            <h2>Withdrawal Successful</h2>
            <p>Hello {{ .Fullname }},</p>
            <p>We are pleased to inform you that a withdrawal of ${{ .Amount }} has been
                successfully processed from your account.</p>
            <p>Your updated account balance is now ${{ .WalletBalance }}.</p>
            <p>Thank you for choosing our services!</p>
            <p>Sincerely,<br><b>{{.CompanyName }}</b></p>
        </div>
    </div>
</body>

</html>
